<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Manga — epersie</title>
<meta name="description" content="Una historia real de infancia en el Valle de Aburrá, Colombia.">
<meta property="og:title" content="La Manga — epersie">
<meta property="og:type" content="book">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#F7F3EC; --paper:#EFE9DC; --warm:#E8DFCC;
    --ink:#1C1814; --muted:#6B5F52; --gold:#A0784A;
    --rust:#7A3B1E; --rule:rgba(107,95,82,0.18);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--cream);color:var(--ink);font-family:'Lora',Georgia,serif;font-size:17px;line-height:1.75;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:.028;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size:200px 200px}
  h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:400;line-height:1.2;color:var(--ink)}
  p{margin-bottom:1.1em} p:last-child{margin-bottom:0}
  .container{max-width:720px;margin:0 auto;padding:0 28px}
  .container-wide{max-width:960px;margin:0 auto;padding:0 28px}
  .rule{border:none;border-top:1px solid var(--rule);margin:0}

  /* ── LANG SELECTOR ── */
  .lang-bar{background:var(--ink);padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .lang-bar-inner{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
  .lang-btn{background:none;border:none;cursor:pointer;padding:5px 9px;border-radius:3px;
    font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.06em;
    color:rgba(247,243,236,.45);transition:color .18s,background .18s;white-space:nowrap}
  .lang-btn:hover{color:rgba(247,243,236,.85);background:rgba(247,243,236,.06)}
  .lang-btn.active{color:var(--cream);background:rgba(247,243,236,.12);font-weight:500}
  .lang-sep{color:rgba(247,243,236,.18);font-size:11px;user-select:none}

  /* ── MASTHEAD ── */
  .masthead{padding:22px 0 18px;border-bottom:1px solid var(--ink)}
  .masthead-inner{display:flex;justify-content:space-between;align-items:baseline}
  .masthead-brand{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.25em;
    text-transform:uppercase;color:var(--muted);text-decoration:none}
  .masthead-link{font-family:'Lora',serif;font-size:13px;color:var(--muted);text-decoration:none;
    letter-spacing:.04em;transition:color .2s}
  .masthead-link:hover{color:var(--rust)}

  /* ── HERO ── */
  .hero{padding:72px 0 80px}
  .hero-grid{display:grid;grid-template-columns:1fr 1.6fr;gap:64px;align-items:start}
  .hero-book-cover{width:100%;aspect-ratio:2/3;background:var(--ink);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:32px 24px;
    box-shadow:8px 10px 32px rgba(28,24,20,.22);position:relative;overflow:hidden}
  .hero-book-cover::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.015) 2px,rgba(255,255,255,.015) 4px)}
  .cover-rule{width:100%;border-top:1px solid rgba(247,243,236,.25);margin-bottom:20px}
  .cover-rule-mid{width:40px;border-top:1px solid rgba(247,243,236,.4);margin:0 auto 12px}
  .cover-title-main{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;
    color:var(--cream);text-align:center;line-height:1.1;margin-bottom:12px}
  .cover-subtitle-text{font-family:'Cormorant Garamond',serif;font-size:13px;font-weight:300;
    font-style:italic;color:rgba(247,243,236,.7);text-align:center;letter-spacing:.06em;margin-bottom:28px}
  .cover-illustration{margin-bottom:24px;opacity:.55}
  .cover-rule-bot{width:100%;border-top:1px solid rgba(247,243,236,.25);margin-bottom:14px}
  .cover-author{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;color:rgba(247,243,236,.55);text-align:center}
  .hero-badge{position:absolute;bottom:-14px;right:-14px;background:var(--gold);color:var(--cream);
    font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    padding:8px 14px;box-shadow:2px 2px 8px rgba(28,24,20,.2)}
  .hero-book{position:relative}
  .hero-content{padding-top:8px}
  .hero-kicker{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:12px}
  .hero-kicker::before{content:'';display:block;width:24px;height:1px;background:var(--muted)}
  .hero-title{font-size:clamp(36px,5vw,52px);font-weight:400;line-height:1.08;margin-bottom:8px}
  .hero-title em{font-style:italic;color:var(--gold)}
  .hero-subtitle{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;font-style:italic;
    color:var(--muted);margin-bottom:28px;line-height:1.4}
  .hero-body{font-size:16px;color:var(--muted);margin-bottom:32px;line-height:1.8}
  .hero-cta{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .hero-price{font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--muted);font-style:italic}

  /* ── BUTTON ── */
  .btn{display:inline-block;background:var(--ink);color:var(--cream);font-family:'Lora',serif;
    font-size:14px;letter-spacing:.08em;text-decoration:none;padding:14px 36px;border:none;
    cursor:pointer;transition:background .2s,transform .15s}
  .btn:hover{background:var(--rust);transform:translateY(-1px)}
  .btn-cream{background:var(--cream);color:var(--ink);font-size:15px;padding:16px 48px}
  .btn-cream:hover{background:var(--gold);color:var(--cream);transform:translateY(-2px)}

  /* ── BANNER QUOTE ── */
  .banner-quote{background:var(--ink);color:var(--cream);padding:52px 0;position:relative;overflow:hidden}
  .banner-quote::before{content:'\201C';position:absolute;left:-20px;top:-40px;
    font-family:'Playfair Display',serif;font-size:280px;color:rgba(247,243,236,.04);line-height:1;pointer-events:none}
  .banner-quote blockquote{font-family:'Playfair Display',serif;font-size:clamp(18px,3vw,26px);
    font-style:italic;text-align:center;max-width:680px;margin:0 auto;color:var(--cream);line-height:1.5}
  .banner-quote cite{display:block;margin-top:18px;font-family:'Cormorant Garamond',serif;
    font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:rgba(247,243,236,.45);font-style:normal}

  /* ── SECTIONS ── */
  .section{padding:80px 0}
  .section-alt{background:var(--paper)}
  .section-label{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.28em;
    text-transform:uppercase;color:var(--muted);margin-bottom:24px}
  .section-title{font-size:clamp(26px,4vw,38px);font-weight:400;margin-bottom:28px;line-height:1.15}

  /* ── PROBLEM LIST ── */
  .problem-list{list-style:none;margin:0 0 32px}
  .problem-list li{font-size:16px;padding:14px 0 14px 28px;border-bottom:1px solid var(--rule);
    position:relative;color:var(--muted);font-style:italic}
  .problem-list li::before{content:'—';position:absolute;left:0;color:var(--gold);font-style:normal}
  .problem-list li:first-child{border-top:1px solid var(--rule)}

  /* ── TRANSFORM GRID ── */
  .transform-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-top:32px}
  .transform-card{background:var(--cream);padding:28px 24px;border:1px solid var(--rule)}
  .transform-card.after{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  .transform-label{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.25em;
    text-transform:uppercase;color:var(--muted);margin-bottom:16px}
  .transform-card.after .transform-label{color:rgba(247,243,236,.45)}
  .transform-card ul{list-style:none}
  .transform-card ul li{font-size:15px;padding:7px 0;border-bottom:1px solid var(--rule);color:var(--muted)}
  .transform-card.after ul li{border-color:rgba(247,243,236,.1);color:rgba(247,243,236,.85)}
  .transform-card ul li:last-child{border-bottom:none}

  /* ── CONTENTS ── */
  .content-item{display:grid;grid-template-columns:48px 1fr;gap:20px;padding:24px 0;
    border-bottom:1px solid var(--rule);align-items:start}
  .content-item:first-child{border-top:1px solid var(--rule)}
  .content-num{font-family:'Playfair Display',serif;font-size:32px;color:var(--warm);line-height:1;padding-top:4px}
  .content-title{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:6px}
  .content-desc{font-size:14px;color:var(--muted);line-height:1.6;font-style:italic;margin:0}

  /* ── EXCERPT ── */
  .excerpt-box{background:var(--warm);padding:48px 52px;border-left:3px solid var(--gold);position:relative}
  .excerpt-box::before{content:'\201C';position:absolute;top:16px;left:24px;
    font-family:'Playfair Display',serif;font-size:64px;color:var(--gold);line-height:1;opacity:.4}
  .excerpt-text{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;
    line-height:1.7;color:var(--ink);margin-bottom:20px}
  .excerpt-source{font-size:13px;color:var(--muted)}

  /* ── 7 DAYS ── */
  .days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:32px}
  .day-card{background:var(--cream);border:1px solid var(--rule);padding:16px 10px;text-align:center;
    transition:border-color .2s,background .2s}
  .day-card:hover{border-color:var(--gold);background:var(--paper)}
  .day-num{font-family:'Playfair Display',serif;font-size:28px;color:var(--gold);display:block;margin-bottom:6px}
  .day-title{font-size:11px;color:var(--muted);line-height:1.4;font-style:italic}

  /* ── FOR WHOM ── */
  .for-whom-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:32px}
  .for-whom-col h3{font-size:16px;font-weight:400;font-style:italic;margin-bottom:16px}
  .for-whom-col ul{list-style:none}
  .for-whom-col ul li{font-size:15px;padding:10px 0 10px 20px;border-bottom:1px solid var(--rule);
    position:relative;color:var(--muted)}
  .for-col-yes li::before{content:'✓';position:absolute;left:0;color:var(--gold);font-size:13px}
  .for-col-no li::before{content:'×';position:absolute;left:0;color:var(--muted);font-size:13px}

  /* ── AUTHOR ── */
  .author-grid{display:grid;grid-template-columns:1fr 2fr;gap:60px;align-items:start}
  .author-initials{aspect-ratio:1;background:var(--ink);display:flex;align-items:center;
    justify-content:center;font-family:'Playfair Display',serif;font-size:48px;color:var(--cream);font-style:italic}
  .author-name{font-family:'Playfair Display',serif;font-size:28px;font-style:italic;margin-bottom:6px}
  .author-meta{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted);margin-bottom:20px}
  .author-bio{font-size:16px;color:var(--muted);line-height:1.8}
  .author-bio p{margin-bottom:.9em}

  /* ── FINAL CTA ── */
  .final-cta{background:var(--ink);color:var(--cream);padding:96px 0;text-align:center;
    position:relative;overflow:hidden}
  .final-cta::before{content:'LA MANGA';position:absolute;font-family:'Playfair Display',serif;
    font-size:180px;font-weight:700;color:rgba(247,243,236,.03);letter-spacing:.1em;
    top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none}
  .final-cta-title{font-size:clamp(26px,4vw,40px);font-weight:400;font-style:italic;
    margin-bottom:16px;color:var(--cream)}
  .final-cta-sub{font-family:'Cormorant Garamond',serif;font-size:18px;font-style:italic;
    color:rgba(247,243,236,.6);margin-bottom:40px;max-width:480px;margin-left:auto;margin-right:auto}
  .final-price{font-family:'Cormorant Garamond',serif;font-size:14px;color:rgba(247,243,236,.4);
    margin-top:18px;font-style:italic}

  /* ── FOOTER ── */
  .footer{padding:32px 0;border-top:1px solid var(--rule)}
  .footer-inner{display:flex;justify-content:space-between;align-items:center;
    font-family:'Cormorant Garamond',serif;font-size:13px;color:var(--muted);letter-spacing:.08em}
  .footer-inner a{color:var(--muted);text-decoration:none}
  .footer-inner a:hover{color:var(--rust)}

  /* ── ANIMATIONS ── */
  @keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
  .fade-up{animation:fadeUp .8s ease forwards;opacity:0}
  .delay-1{animation-delay:.1s}.delay-2{animation-delay:.25s}.delay-3{animation-delay:.4s}
  .delay-4{animation-delay:.55s}.delay-5{animation-delay:.7s}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
  .reveal.visible{opacity:1;transform:translateY(0)}

  /* ── RESPONSIVE ── */
  @media(max-width:700px){
    .hero-grid{grid-template-columns:1fr;gap:48px}
    .hero-book{max-width:240px;margin:0 auto}
    .transform-grid{grid-template-columns:1fr}
    .days-grid{grid-template-columns:repeat(4,1fr)}
    .for-whom-grid{grid-template-columns:1fr}
    .author-grid{grid-template-columns:1fr}
    .author-initials{max-width:120px}
    .excerpt-box{padding:36px 28px 36px 36px}
    .masthead-link{display:none}
    .lang-btn{font-size:12px;padding:4px 7px}
  }
</style>
</head>

<!-- PULL QUOTE -->

  </div>

<!-- PROBLEM -->

  <div class="container">
    <div class="section-label" data-t="problem_label"></div>
    <h2 class="section-title" data-t="problem_title"></h2>

let currentLang = 'es';

function setLang(lang) {
  if (!T[lang]) return;
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.lang === lang)
  );
  const d = T[lang];
  document.documentElement.lang = lang;

  // Simple text nodes
  // Update all Amazon links for this language
  const amazonUrl = AMAZON_LINKS[lang] || AMAZON_LINKS['es'];
  document.querySelectorAll('a[href*="amazon.com"]').forEach(a => {
    a.href = amazonUrl;
  });

  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.dataset.t;
    if (d[key] !== undefined && typeof d[key] === 'string') {
      el.textContent = d[key];
    }
  });

  // Problem list
  const pl = document.getElementById('problem-list');
  if (pl && d.problem_items) {
    pl.innerHTML = d.problem_items.map(t => `<li>${t}</li>`).join('');
  }

  // Before / After lists
  const bl = document.getElementById('before-list');
  const al = document.getElementById('after-list');
  if (bl && d.before_items) bl.innerHTML = d.before_items.map(t=>`<li>${t}</li>`).join('');
  if (al && d.after_items) al.innerHTML = d.after_items.map(t=>`<li>${t}</li>`).join('');

  // Contents
  const cl = document.getElementById('contents-list');
  if (cl && d.contents) {
    cl.innerHTML = d.contents.map((c,i) => `
      <div class="content-item">
        <div class="content-num">${['I','II','III','IV'][i]}</div>
        <div>
          <div class="content-title">${c.t}</div>
          <p class="content-desc">${c.d}</p>
        </div>
      </div>`).join('');
  }

  // Days
  const dg = document.getElementById('days-grid');
  if (dg && d.days) {
    dg.innerHTML = d.days.map((t,i) => `
      <div class="day-card">
        <span class="day-num">${i+1}</span>
        <span class="day-title">${t}</span>
      </div>`).join('');
  }

  // For whom lists
  const fy = document.getElementById('forwhom-yes');
  const fn = document.getElementById('forwhom-no');
  if (fy && d.forwhom_yes) fy.innerHTML = d.forwhom_yes.map(t=>`<li>${t}</li>`).join('');
  if (fn && d.forwhom_no)  fn.innerHTML = d.forwhom_no.map(t=>`<li>${t}</li>`).join('');

  // Author bio
  const ab = document.getElementById('author-bio');
  if (ab && d.author_bio) {
    ab.innerHTML = d.author_bio.map(p => `<p>${p}</p>`).join('');
  }
}

// Scroll reveal
const reveals = document.querySelectorAll('.reveal');
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
  });
}, { threshold: 0.06 });
reveals.forEach(el => obs.observe(el));

// Init
setLang('es');
</script>
